name: snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.SNK_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff8c1a&color_dots=#ebedf0,#c5e1a5,#7cb342,#2e7d32,#1b4d1e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff8c1a&color_dots=#161b22,#1b4d1e,#2e7d32,#5fa83b,#9ccc65

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
